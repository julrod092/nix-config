---
# inspo: https://github.com/reckenrode/nixos-configs/blob/main/.github/workflows/main.yml
name: Bump flake.lock
permissions:
  contents: write
  pull-requests: write
on:
  schedule:
    - cron: 0 10 * * *
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            extra-platforms = aarch64-linux

      - run: nix flake update

      - run: nix flake check --no-build --all-systems

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/flake-update
          delete-branch: true
          commit-message: "chore(deps): bump flake.lock"
          title: "chore(deps): bump flake.lock"
          body: "Automated flake input update. All configuration evaluations passed."
          add-paths: flake.lock
