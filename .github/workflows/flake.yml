---
name: Bump flake lock

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: 0 10 * * *
  workflow_dispatch: null

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - run: nix flake update
      - run: nix develop .#ci --command make format-check
      - run: nix develop .#ci --command make lint
      - run: nix develop .#ci --command make test
      - run: nix develop .#ci --command make secret-check
      - run: nix flake check --no-build --all-systems
      - run: nix develop .#ci --command make build-linux
      - run: nix run .#gitleaks -- git --redact --no-banner .
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/flake-update
          delete-branch: true
          commit-message: "chore(deps): bump flake.lock"
          title: "chore(deps): bump flake.lock"
          body: "Automated workstation input update. All checks passed."
          add-paths: flake.lock
